# Default paper strategy: only take Up/Down quotes when the official-index
# model beats the ask by a fee-adjusted edge, then size with fractional Kelly.
#
# This is the file to copy and edit when you want a new strategy. Point
# config.yaml `strategy.file` at the new file, then git-commit the change.
#
# Daily risk (percent of starting day equity, default $1,000):
#   +5% profit target  → stop opening new positions; let opens settle
#   -10% loss limit    → same stop
name: default
description: >
  Edge-after-fees taker on Polymarket US crypto Up/Down 5m/15m/1h windows,
  using the official CF Benchmarks index via the public Asset Prices API.

discovery:
  assets: [btc, eth, sol, xrp]
  horizons: [5m, 15m, 1h]
  market_type: ASSET_PRICE_MARKET_TYPE_UP_DOWN
  refresh_seconds: 15
  category: crypto

fees:
  # Standard formula: fee = theta * contracts * p * (1-p), banker's rounded to cents.
  # Conservative default: retail Tier 1 (app) coefficient 0.095.
  # API taker promo through 2026-12-31: 0.0695 with a 70% rebate — not assumed here.
  theta: 0.095
  assume_taker: true

volatility:
  lookback_seconds: 900
  annualized_floor:
    btc: 0.40
    eth: 0.50
    sol: 0.70
    xrp: 0.70
  annualized_ceiling:
    btc: 1.50
    eth: 1.80
    sol: 2.50
    xrp: 2.50

rules:
  min_edge_after_fees: 0.04
  max_spread: 0.06
  min_liquidity_contracts: 50
  min_liquidity_usd: 25
  no_trade_final_seconds: 15
  require_price_to_beat: true
  min_seconds_into_window: 5
  min_ask: 0.05
  max_ask: 0.90

sizing:
  kelly_fraction: 0.25
  max_fraction_of_bankroll: 0.05
  max_contracts: 25

risk:
  max_per_bet_usd: 50
  window_mode: calendar_day        # calendar_day (default: session P&L / limits reset at midnight ET) or rolling_24h
  window_hours: 24.0
  daily_profit_target_pct: 0.05    # initial target (+5% of window-start equity); see profit_lock below
  daily_loss_limit_pct: 0.10       # -10% of window-start equity; no new entries once hit
  max_concurrent_positions: 4
  # Dynamic profit target. mode: profit_lock (default) or fixed (stop at the target).
  # profit_lock: once realized session P&L reaches the (possibly adaptive) target,
  # keep trading at locked_size_mult x Kelly with a floor of lock_ratio x peak
  # session gain (ratchets up only). A floor breach pauses new entries for
  # cooldown_minutes[n-1] minutes and then resumes at half Kelly with the floor
  # re-armed from current session P&L. The max_breaches-th breach (default 3)
  # stops the session. Everything resets at the session boundary.
  profit_lock:
    mode: profit_lock
    lock_ratio: 0.70
    locked_size_mult: 0.5
    adaptive: true          # scale the target by the last N days' win rate / edge / P&L vol
    target_min_pct: 0.03
    target_max_pct: 0.10
    lookback_days: 7
    min_days: 3             # need this many prior days before adapting
    max_breaches: 3         # the Nth floor breach stops the session (1..N-1 are cooldowns)
    cooldown_minutes: [60, 120, 240]  # minutes after breaches 1, 2, …; 240 reserved if max_breaches is raised
    cooldown_1_min: 60      # Controls overlay (same values as the list)
    cooldown_2_min: 120
    cooldown_3_min: 240
  # Fail-closed HALT if equity is drawdown_pct below the high-water mark at any
  # point in the trailing lookback (spans midnight). Cleared only by
  # scripts/reset_halt.sh --yes. Independent of the per-session loss limit.
  rolling_guard:
    enabled: true
    drawdown_pct: 0.10
    lookback_hours: 24.0
  max_open_exposure_usd: 200
  one_position_per_market: true
  # If this file exists, the bot stops opening new paper trades (existing ones still settle).
  kill_switch_file: data/KILL

patterns:
  # shadow = record features, compute Bayesian EV & log what it would do (no trade changes)
  # active = enforce skips for confidently negative EV contexts and scale Kelly [0.25x, 1.50x]
  # off    = kill switch (pattern layer disabled)
  mode: shadow
  # Per-strategy overrides (fall back to mode). Applied on the live book when
  # that strategy is active, and in the strategy lab books. late_window is
  # never activated here: walk-forward P&L collapsed. baseline stays shadow
  # because the P&L lift is small and drawdown worsens.
  by_strategy:
    high_conviction: active
    favorite: active
    baseline: shadow
    late_window: shadow
  auto_demote: true
  demote_min_trades: 20
  demote_margin_usd: 20.0
  min_samples: 20
  prior_strength: 10.0
  min_mult: 0.25
  max_mult: 1.50
  skip_ev_threshold: -0.02
  # Phase 6 learning layers (each off / shadow / active; default shadow).
  # shadow logs and shows results without changing live entries.
  attribution_mode: shadow
  counterfactual_mode: shadow   # ingest evaluation CF into a *separate* evidence stream
  cf_weight: 0.25               # weight of one CF example vs one real fill (active blend)
  calibration_mode: shadow      # isotonic/Platt per asset|horizon; active may only tighten edge
  calibration_method: isotonic
  bandit_mode: shadow           # Thompson sampling over contexts; actions skip / 0.5× / 1× / 1.5×

rules_lab:
  # Structured analyst (or later LLM) rule proposals. Promotion is deterministic.
  mode: shadow
  auto_promote: false
  auto_demote: true
  min_shadow_trades: 30
  demote_min_trades: 20
  demote_margin_usd: 20.0
  demote_on_floor_breach: true
